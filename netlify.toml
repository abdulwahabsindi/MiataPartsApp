# Netlify continuous deploy.
#
# Publishes ONLY the built site (dist/), never the repo root — so the internal
# files (project/, docs/, .claude/, scripts/, src/, CLAUDE.md) are not served
# publicly. scripts/build.mjs assembles dist/ from src/ and data/: one
# self-contained index.html, plus the hashed image files beside it.
#
# NODE_VERSION matches the version in .github/workflows/validate.yml. Change
# both together.

[build]
  command = "node scripts/build.mjs"
  publish = "dist"

# No dependencies: the generator is plain Node, and the site ships no libraries.
[build.environment]
  NODE_VERSION = "26.8.1"
  NETLIFY_USE_YARN = "false"

# Image filenames are content hashes, so a changed image is a new filename.
[[headers]]
  for = "/data/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
