# Netlify continuous deploy.
#
# Publishes ONLY the built site (dist/index.html), never the repo root — so the
# internal files (project/, docs/, .claude/, scripts/, CLAUDE.md) are not served
# publicly. The build step assembles dist/ from the deployable files only.
#
# Today the site is index.html plus the hashed image files, so the build just
# copies them in. When the data/ -> index.html generator lands, replace the copy
# with the generator call; the publish directory stays dist/.

[build]
  command = "rm -rf dist && mkdir -p dist && cp index.html dist/ && mkdir -p dist/data && cp -R data/images dist/data/images"
  publish = "dist"

# Static HTML, nothing to install.
[build.environment]
  NETLIFY_USE_YARN = "false"

# Image filenames are content hashes, so a changed image is a new filename.
[[headers]]
  for = "/data/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
