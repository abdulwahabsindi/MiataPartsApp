name: validate

# Runs the catalogue validator on every PR and on pushes to main, so a bad or
# mismatched part can't be merged even if someone forgets to run it locally.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches NODE_VERSION in netlify.toml. Change both together.
          node-version: "26.8.1"
      - name: Validate catalogue against the data contract
        run: node scripts/validate.mjs
      - name: catalogue.md is regenerated and committed
        run: git diff --exit-code project/catalogue.md
      - name: Site builds from src/ and data/
        run: node scripts/build.mjs
