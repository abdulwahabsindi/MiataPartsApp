<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Frequently replaced parts for the Mazda MX-5 (NC, 2006-2015): OEM numbers, brand cross-references, and where to buy in Saudi Arabia and abroad. English and Arabic.">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="NC Miata Parts Counter">
<meta property="og:description" content="Frequently replaced parts for the Mazda MX-5 NC, with OEM numbers, brand alternatives and Saudi sourcing.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%A7%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>NC Miata Parts Counter</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#ECEDE9; --surface:#F8F9F6; --surface-2:#E1E4DD; --raise:#FFFFFF;
  --ink:#191C1A; --ink-2:#4C524D; --ink-3:#79807A;
  --line:#CED2CA; --line-strong:#B3B9B1;
  --accent:#A63A2E; --accent-ink:#A63A2E; --accent-soft:rgba(166,58,46,.09);
  --oem:#6B5A17; --oem-soft:rgba(107,90,23,.11);
  --alt:#2F5B56; --alt-soft:rgba(47,91,86,.10);
  --draft:#8A5A00; --draft-soft:rgba(138,90,0,.10);
  --shadow:0 1px 2px rgba(25,28,26,.06),0 8px 24px rgba(25,28,26,.07);
  --shadow-lg:0 2px 8px rgba(25,28,26,.12),0 24px 60px rgba(25,28,26,.20);
  --r:3px;
  --sans:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --arab:"IBM Plex Sans Arabic","IBM Plex Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#121513; --surface:#1A1E1B; --surface-2:#242A26; --raise:#20251F;
    --ink:#E8EBE5; --ink-2:#A7AEA7; --ink-3:#79817A;
    --line:#2E3531; --line-strong:#414A45;
    --accent:#E07A69; --accent-ink:#E8907F; --accent-soft:rgba(224,122,105,.13);
    --oem:#C9AC55; --oem-soft:rgba(201,172,85,.13);
    --alt:#78BAB1; --alt-soft:rgba(120,186,177,.12);
    --draft:#D3A44E; --draft-soft:rgba(211,164,78,.13);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 2px 8px rgba(0,0,0,.5),0 24px 60px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#121513; --surface:#1A1E1B; --surface-2:#242A26; --raise:#20251F;
  --ink:#E8EBE5; --ink-2:#A7AEA7; --ink-3:#79817A;
  --line:#2E3531; --line-strong:#414A45;
  --accent:#E07A69; --accent-ink:#E8907F; --accent-soft:rgba(224,122,105,.13);
  --oem:#C9AC55; --oem-soft:rgba(201,172,85,.13);
  --alt:#78BAB1; --alt-soft:rgba(120,186,177,.12);
  --draft:#D3A44E; --draft-soft:rgba(211,164,78,.13);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 2px 8px rgba(0,0,0,.5),0 24px 60px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
#app[dir="rtl"]{font-family:var(--arab)}
#app[dir="rtl"] .mono{font-family:var(--mono);direction:ltr}
button,input{font:inherit;color:inherit}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.92em;letter-spacing:-.01em}

/* ---- masthead ---- */
.mast{border-bottom:1px solid var(--line);background:var(--surface)}
.mast-in{padding:22px 0}
.mast-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:11px}
.brandline{display:flex;align-items:center;gap:10px;flex:1 1 auto;min-width:0}
.chassis{font-family:var(--cond);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--raise);background:var(--accent);padding:3px 8px;border-radius:2px;flex:0 0 auto}
.kicker{font-family:var(--cond);font-weight:600;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);line-height:1.35}
#app[dir="rtl"] .kicker,#app[dir="rtl"] .chassis{letter-spacing:0;font-family:var(--arab)}
h1{font-family:var(--cond);font-weight:700;font-size:clamp(30px,4.4vw,44px);line-height:1.03;margin:0;letter-spacing:-.01em;text-wrap:balance}
#app[dir="rtl"] h1{font-family:var(--arab);letter-spacing:0;line-height:1.25}
.sub{color:var(--ink-2);font-size:13.5px;margin-top:9px;max-width:62ch}
.mast-tools{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.tbtn{background:transparent;border:1px solid var(--line-strong);color:var(--ink-2);padding:7px 13px;border-radius:var(--r);cursor:pointer;font-size:13px;font-weight:500;transition:background .15s,color .15s,border-color .15s}
.tbtn:hover{background:var(--surface-2);color:var(--ink)}
.langsw{display:flex;border:1px solid var(--line-strong);border-radius:100px;overflow:hidden;background:var(--surface)}
.langsw button{background:transparent;border:0;padding:6px 15px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-3);letter-spacing:.02em;transition:background .15s,color .15s}
.langsw button:hover{color:var(--ink)}
.langsw button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}

/* ---- controls ---- */
.controls{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--ground) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.controls-in{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:13px 0}
.search{position:relative;flex:1 1 300px;min-width:240px}
.search input{width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);padding:9px 12px 9px 34px;font-size:14px}
#app[dir="rtl"] .search input{padding:9px 34px 9px 12px}
.search svg{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-3);pointer-events:none}
.search input::placeholder{color:var(--ink-3)}
.cats{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;flex:1 1 100%;min-width:0;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%);mask-image:linear-gradient(to right,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%)}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;scroll-snap-align:start;background:transparent;border:1px solid var(--line);color:var(--ink-2);padding:6px 12px;border-radius:100px;cursor:pointer;font-size:12.5px;font-weight:500;white-space:nowrap;transition:.15s}
.cat:hover{border-color:var(--line-strong);color:var(--ink)}
.cat[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.cat .n{opacity:.55;margin-inline-start:5px;font-family:var(--mono);font-size:11px}

/* ---- grid ---- */
.count{padding:20px 0 12px;font-size:12.5px;color:var(--ink-3);font-family:var(--cond);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
#app[dir="rtl"] .count{font-family:var(--arab);letter-spacing:0;text-transform:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding-bottom:56px;align-items:stretch}
.card{position:relative;display:flex;flex-direction:column;gap:10px;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px 15px;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s}
.card:hover{border-color:var(--line-strong);box-shadow:var(--shadow);transform:translateY(-1px)}
.card-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.idx{font-family:var(--mono);font-size:11px;color:var(--ink-3);padding-top:3px;min-width:20px}
.card h3{font-family:var(--cond);font-weight:600;font-size:19px;line-height:1.18;margin:0;letter-spacing:-.005em}
#app[dir="rtl"] .card h3{font-family:var(--arab);font-size:18px;line-height:1.4}
.card .alt-name{color:var(--ink-3);font-size:13.5px;margin-top:3px;font-family:var(--arab)}
#app[dir="rtl"] .card .alt-name{font-family:var(--sans);direction:ltr;text-align:right}
.chip{display:inline-block;font-size:10.5px;font-weight:600;font-family:var(--cond);letter-spacing:.07em;text-transform:uppercase;padding:3px 7px;border-radius:2px;white-space:nowrap}
#app[dir="rtl"] .chip{font-family:var(--arab);letter-spacing:0;text-transform:none;font-size:11px}
.chip-cat{background:var(--surface-2);color:var(--ink-2)}
.chip-int{background:var(--accent-soft);color:var(--accent-ink)}
.card .chip-int{white-space:normal;text-transform:none;letter-spacing:0;font-family:var(--sans);font-weight:500;font-size:11.5px;max-width:100%}
#app[dir="rtl"] .card .chip-int{font-family:var(--arab)}
.card{overflow:hidden;min-width:0}
.card-oem{display:flex;justify-content:space-between;gap:10px;align-items:baseline;border-top:1px dashed var(--line);padding-top:10px;margin-top:auto}
.card-oem .lab{font-size:11px;color:var(--ink-3);font-family:var(--cond);letter-spacing:.07em;text-transform:uppercase}
#app[dir="rtl"] .card-oem .lab{font-family:var(--arab);letter-spacing:0;text-transform:none}
.card-oem .val{font-family:var(--mono);font-size:13px;color:var(--oem);font-weight:500}
.card-foot{display:flex;gap:14px;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-3)}
.card-foot b{color:var(--alt);font-weight:600;font-family:var(--mono);font-size:12.5px}
.viewcue{display:inline-flex;align-items:center;gap:5px;color:var(--accent-ink);font-family:var(--cond);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
#app[dir="rtl"] .viewcue{font-family:var(--arab);letter-spacing:0;text-transform:none;font-size:12px}
.viewcue .arrow{display:inline-block;transition:transform .15s}
.card:hover .viewcue .arrow{transform:translateX(3px)}
#app[dir="rtl"] .viewcue .arrow{transform:scaleX(-1)}
#app[dir="rtl"] .card:hover .viewcue .arrow{transform:scaleX(-1) translateX(3px)}
.empty{padding:60px 0;text-align:center;color:var(--ink-3)}
.thumb{flex:0 0 auto;width:62px;height:62px;border-radius:3px;background:#fff;border:1px solid var(--line);overflow:hidden;display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.ctxt{min-width:0;flex:1 1 auto}
.dimg{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;place-items:center}
.dimg img{height:240px;width:auto;max-width:100%;object-fit:contain;display:block}
.imgcap{font-size:11.5px;color:var(--ink-3);margin-top:7px;line-height:1.45}

/* ---- sections ---- */
.band{border-top:1px solid var(--line);background:var(--surface);padding:40px 0 46px}
.band h2{font-family:var(--cond);font-weight:700;font-size:22px;margin:0 0 4px;letter-spacing:-.005em}
#app[dir="rtl"] .band h2{font-family:var(--arab)}
.band .lede{color:var(--ink-2);font-size:13.5px;margin:0 0 22px;max-width:64ch}
.vendors{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.vendor{border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;background:var(--ground)}
.vendor .vt{font-size:10.5px;font-family:var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
#app[dir="rtl"] .vendor .vt{font-family:var(--arab);letter-spacing:0;text-transform:none}
.vendor .vn{font-weight:600;font-size:14.5px;line-height:1.3}
.vendor .vd{color:var(--ink-2);font-size:12.5px;margin-top:5px}
.vendor a{color:var(--accent-ink);text-decoration:none;font-size:12.5px;font-family:var(--mono);word-break:break-all}
.vendor a:hover{text-decoration:underline}
.faqlist{display:flex;flex-direction:column;gap:9px;max-width:80ch}
.faqq{border:1px dashed var(--line-strong);border-radius:var(--r);padding:12px 15px;background:var(--ground)}
.faqq .q{font-weight:600;font-size:14px}
.faqq .a{color:var(--ink-3);font-size:12.5px;margin-top:4px;font-style:italic}
footer{border-top:1px solid var(--line);padding:26px 0 40px;color:var(--ink-3);font-size:12.5px}
footer .fl{display:flex;flex-wrap:wrap;gap:6px 20px}
footer .credit{font-family:var(--cond);font-weight:700;font-size:14px;color:var(--ink);letter-spacing:.01em;padding-bottom:12px;margin-bottom:13px;border-bottom:1px solid var(--line)}
#app[dir="rtl"] footer .credit{font-family:var(--arab);letter-spacing:0}

/* ---- drawer ---- */
.scrim{position:fixed;inset:0;background:rgba(10,14,11,.5);opacity:0;pointer-events:none;transition:opacity .22s;z-index:60}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;inset-block:0;inset-inline-end:0;width:min(620px,100%);background:var(--ground);border-inline-start:1px solid var(--line-strong);box-shadow:var(--shadow-lg);z-index:70;overflow-y:auto;transform:translateX(102%);transition:transform .26s cubic-bezier(.32,.72,0,1)}
#app[dir="rtl"] .drawer{transform:translateX(-102%)}
.drawer.on,#app[dir="rtl"] .drawer.on{transform:translateX(0)}
.dhead{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:18px 26px 16px;z-index:2}
.dclose{position:absolute;top:14px;inset-inline-end:16px;background:transparent;border:1px solid var(--line-strong);border-radius:var(--r);width:30px;height:30px;cursor:pointer;color:var(--ink-2);line-height:1}
.dclose:hover{background:var(--surface-2);color:var(--ink)}
.dhead .idx2{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-bottom:6px}
.dhead h2{font-family:var(--cond);font-weight:700;font-size:26px;line-height:1.12;margin:0;padding-inline-end:40px;letter-spacing:-.01em}
#app[dir="rtl"] .dhead h2{font-family:var(--arab);line-height:1.35}
.dhead .alt2{color:var(--ink-3);font-size:15px;margin-top:4px;font-family:var(--arab)}
#app[dir="rtl"] .dhead .alt2{font-family:var(--sans);direction:ltr;text-align:right}
.dhead .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.dbody{padding:22px 26px 60px;display:flex;flex-direction:column;gap:26px}
.sec .sh{font-family:var(--cond);font-weight:700;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);padding-bottom:7px;border-bottom:1px solid var(--line);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
#app[dir="rtl"] .sec .sh{font-family:var(--arab);letter-spacing:0;text-transform:none;font-size:12.5px}
.why-sum{cursor:pointer;list-style:none;margin-bottom:0}
.why-sum::-webkit-details-marker{display:none}
.why-sum::marker{content:""}
.why-sum:hover{color:var(--ink-2)}
.why-chev{color:var(--ink-3);font-size:12px;transition:transform .2s}
details[open] .why-sum{margin-bottom:12px}
details[open] .why-chev{transform:rotate(180deg)}
.kv{display:grid;grid-template-columns:minmax(96px,auto) 1fr;gap:7px 18px;font-size:13.5px}
.kv dt{color:var(--ink-3);font-size:12px}
.kv dd{margin:0}
.pn{font-family:var(--mono);font-size:13.5px;font-weight:500;color:var(--oem)}
.sups{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.sup{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);color:var(--ink-2);padding:2px 6px;border-radius:2px}
.note{background:var(--surface);border:1px solid var(--line);border-inline-start:3px solid var(--accent);border-radius:var(--r);padding:13px 15px;font-size:13.5px;line-height:1.6}
.note .why{color:var(--ink)}
.sym{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.sym li{position:relative;padding-inline-start:15px;font-size:13px;color:var(--ink-2)}
.sym li::before{content:"";position:absolute;inset-inline-start:0;top:8px;width:5px;height:5px;background:var(--accent);border-radius:50%}
.draftflag{font-size:10.5px;font-weight:600;font-family:var(--cond);letter-spacing:.07em;text-transform:uppercase;color:var(--draft);background:var(--draft-soft);padding:2px 7px;border-radius:2px;white-space:nowrap}
#app[dir="rtl"] .draftflag{font-family:var(--arab);letter-spacing:0;text-transform:none;font-size:11px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:420px}
th{text-align:start;font-family:var(--cond);font-weight:700;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);background:var(--surface);padding:8px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
#app[dir="rtl"] th{font-family:var(--arab);letter-spacing:0;text-transform:none;font-size:12px}
td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.oemrow{background:var(--oem-soft)}
td.brand{font-weight:600;white-space:nowrap}
td.num{font-family:var(--mono);font-size:12.5px}
.eq{font-size:10.5px;font-weight:600;font-family:var(--cond);letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:2px;white-space:nowrap}
#app[dir="rtl"] .eq{font-family:var(--arab);letter-spacing:0;text-transform:none;font-size:11px}
.eq-oem{background:var(--oem-soft);color:var(--oem)}
.eq-dir{background:var(--alt-soft);color:var(--alt)}
.srcgrid{display:grid;gap:10px}
.src{border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;background:var(--surface)}
.src .st{font-size:10.5px;font-family:var(--cond);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
#app[dir="rtl"] .src .st{font-family:var(--arab);letter-spacing:0;text-transform:none;font-size:12px}
.srcpills{display:flex;flex-wrap:wrap;gap:5px}
.pill{font-size:12px;background:var(--ground);border:1px solid var(--line);padding:3px 9px;border-radius:100px;color:var(--ink-2);text-decoration:none}
a.pill:hover{border-color:var(--accent);color:var(--accent-ink)}
.hidden{display:none!important}
@media (max-width:560px){
  .wrap{padding:0 16px}
  .dbody,.dhead{padding-inline:18px}
  .grid{grid-template-columns:1fr}
}
</style>

</head>
<body>
<div id="app" dir="ltr">
  <header class="mast">
    <div class="wrap mast-in">
      <div class="mast-top">
        <div class="brandline">
          <span class="chassis">NC</span>
          <span class="kicker" data-t="kicker"></span>
        </div>
        <div class="mast-tools">
          <div class="langsw" role="group" aria-label="Language">
            <button id="btn-en" aria-pressed="true">EN</button>
            <button id="btn-ar" aria-pressed="false" style="font-family:var(--arab)">عربي</button>
          </div>
        </div>
      </div>
      <h1 data-t="title"></h1>
      <p class="sub" data-t="sub"></p>
    </div>
  </header>

  <div class="controls">
    <div class="wrap controls-in">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input id="q" type="search" autocomplete="off">
      </div>
      <div class="cats" id="cats"></div>
    </div>
  </div>

  <main class="wrap">
    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
  </main>

  <section class="band">
    <div class="wrap">
      <h2 data-t="faqH"></h2>

"NC-OIL-FILTER":{en:{i:"Every oil change — 5,000–8,000 km in Saudi heat",w:"Pure consumable. The media loads with combustion soot and wear metal from the moment it goes on, so it leaves with the oil rather than waiting to fail.",p:["The NC filter is a small spin-on sharing a thread with several Ford applications — that is why Motorcraft FL-910S is the most common substitute on local shelves.","Pre-fill it and oil the gasket before fitting; a dry gasket is the usual cause of a weeping filter.","Heat, short trips and dusty air all shorten oil life, so many owners here run tighter than the book interval."]},ar:{i:"مع كل تغيير زيت — كل ٥٬٠٠٠ إلى ٨٬٠٠٠ كم في أجواء السعودية",w:"قطعة استهلاكية بحتة. وسط الفلتر يمتلئ بالسخام وبرادة التآكل منذ لحظة تركيبه، فيُستبدل مع الزيت لا بعد تعطله.",p:["فلتر NC صغير لولبي يشترك في مقاس القلاووظ مع عدة تطبيقات فورد، ولهذا يُعد موتوركرافت FL-910S أكثر البدائل توفراً في المحلات.","املأه بالزيت وادهن الجلدة قبل التركيب؛ الجلدة الجافة هي السبب الأشهر لتسريب الفلتر.","الحرارة والرحلات القصيرة والغبار تقصّر عمر الزيت، لذا يقصّر كثير من الملاك الفترة عن الرقم الدفتري."]}},
"NC-DRAIN-WASHER":{en:{i:"Every oil change",w:"Single-use by design — the aluminium ring crushes to take the shape of the sump face. Reuse it and it cannot crush again, which is how a drain plug starts weeping.",p:["14 mm inner diameter — sold generically in aluminium or copper when the OEM ring is not on the shelf.","Cheap enough to buy a handful at a time; most workshops will reuse yours unless you hand them a new one.","Torque the plug to spec — overtightening to stop a leak is what strips the aluminium sump thread."]},ar:{i:"مع كل تغيير زيت",w:"مصممة للاستخدام مرة واحدة؛ حلقة الألمنيوم تنضغط لتأخذ شكل سطح الكارتير، وإعادة استخدامها تعني أنها لن تنضغط مجدداً، وهنا يبدأ تسريب صامولة التصريف.",p:["القطر الداخلي ١٤ مم، وتتوفر بشكل عام من الألمنيوم أو النحاس عند عدم توفر القطعة الأصلية.","سعرها زهيد فاشترِ عدة قطع دفعة واحدة؛ أغلب الورش تعيد استخدام القديمة ما لم تسلّمهم واحدة جديدة.","اربط الصامولة بعزم الربط المحدد؛ الشد الزائد لإيقاف التسريب هو ما يخرّب قلاووظ الكارتير الألمنيوم."]}},
"NC-AIR-FILTER":{en:{i:"Inspect every oil change; replace around 20,000 km — half that with regular desert or city-dust driving",w:"A wear item everywhere, but a fast-moving one here: the panel filter sees the same fine sand and dust as every other car in the Kingdom, and a loaded filter costs throttle response long before it throws a code.",p:["Hold it up to a light — if the light does not come through the pleats, it is done.","A washable K&N panel is the common choice for people who would rather clean than re-buy, but it needs re-oiling discipline.","Blowing it out with an air line pushes dust through the media; it does not restore it."]},ar:{i:"افحصه مع كل تغيير زيت، واستبدله كل ٢٠٬٠٠٠ كم تقريباً، أو نصف ذلك مع القيادة في البر أو غبار المدينة",w:"قطعة تآكل في كل مكان لكنها سريعة الاستهلاك هنا: الفلتر المسطّح يتعرض لنفس الغبار والرمال الناعمة التي تتعرض لها كل سيارة في المملكة، والفلتر المتسخ يسرق استجابة الدعسة قبل أن يظهر أي عطل على الكمبيوتر.",p:["ارفعه أمام مصدر ضوء؛ إذا لم يعد الضوء يعبر بين الطيّات فقد انتهى عمره.","فلتر K&N القابل للغسل خيار شائع لمن يفضّل التنظيف على الشراء المتكرر، لكنه يحتاج انضباطاً في إعادة تزييته.","نفخه بالهواء المضغوط يدفع الغبار عبر الوسط ولا يعيده جديداً."]}},
"NC-SPARK-PLUGS":{en:{i:"Every 100,000 km per Mazda; many owners change at 60,000–80,000 km",w:"Iridium plugs on the LF-VE last, but not forever — the gap opens as the electrode erodes and the coils work harder to bridge it. Worn plugs are the cheapest thing to rule out before chasing a misfire.",p:["2.0 L only. The 1.8 L NC, never sold new here, takes a different plug.","NGK ILTR6A-13G is the direct iridium equivalent to the Mazda part; LTR6BI-13 and LTR6IX-11 are the common alternates.","The gap is pre-set on iridium plugs — do not gap them with a feeler blade or you will chip the fine wire."]},ar:{i:"كل ١٠٠٬٠٠٠ كم حسب مازدا، وكثير من الملّاك يغيّرها بين ٦٠٬٠٠٠ و٨٠٬٠٠٠ كم",w:"بواجي الإيريديوم في محرك LF-VE تعمّر طويلاً لكنها لا تدوم للأبد؛ تتسع الفجوة مع تآكل القطب فيزيد الحمل على الكويلات. البواجي المستهلكة أرخص ما تستبعده قبل مطاردة رجّة المحرك.",p:["تناسب محرك ٢٫٠ لتر فقط؛ محرك ١٫٨ لتر غير المطروح جديداً هنا يأخذ بوجي مختلفاً.","NGK ILTR6A-13G هو المكافئ المباشر لقطعة مازدا، وLTR6BI-13 وLTR6IX-11 من البدائل الشائعة.","فجوة بواجي الإيريديوم مضبوطة من المصنع؛ لا تعايرها بأداة القياس حتى لا تكسر السلك الرفيع."]}},
"NC-IGNITION-COIL":{en:{i:"No service interval — replace on failure; many owners replace all four once the second one goes",w:"Four coil-on-plug units sitting directly on a hot engine, firing thousands of times a minute. Insulation and windings give up with heat and age. This is the NC's most common single-cylinder misfire and one of the few electrical parts that fails on a schedule of its own.",p:["Symptom is a rough idle, a flashing check-engine light and a P0301–P0304 code naming the cylinder.","Move the suspect coil to another cylinder and re-read the code — if the misfire follows it, the coil is the fault, not the plug or injector.","Under-hood heat here is why these go early; a matched set of four is the common call."]},ar:{i:"لا يوجد جدول صيانة؛ تُستبدل عند التلف، وكثير من الملّاك يستبدل الأربعة عند تلف الثاني",w:"أربعة كويلات مركّبة مباشرة فوق البواجي على محرك ساخن، تشتعل آلاف المرات في الدقيقة. العزل واللفّات تستسلم مع الحرارة والعمر. هذا أشهر سبب لرجّة أسطوانة واحدة في NC، ومن القطع الكهربائية القليلة التي تتعطل بجدول خاص بها.",p:["العرض: رجّة في الرالنتي، ولمبة المحرك تومض، وكود من P0301 إلى P0304 يحدد الأسطوانة.","انقل الكويل المشتبه به إلى أسطوانة أخرى وأعد قراءة الكود؛ إذا انتقلت الرجّة معه فالعطل في الكويل لا في البوجي أو البخاخ.","حرارة حجرة المحرك هنا سبب تلفها المبكر، ولهذا يفضّل الكثيرون شراء طقم مطابق من أربعة."]}},
"NC-COOLANT-TANK":{en:{i:"Inspect yearly from around 8 years; replace at the first sign of crazing, staining or weeping",w:"On the NC this tank is pressurised — part of the cooling circuit, not an overflow bottle. Plastic under pressure plus under-hood heat ages hard: it crazes, then splits at the seam or the neck, and the car loses coolant slowly enough that people miss it.",p:["A pink or white crust around the seam is coolant that has already dried. The tank is leaking.","Replace the cap with it — a tired cap will not hold pressure and the tank gets blamed.","Aluminium replacements exist (Moroso, Jass Performance, and cheaper imports) and are a popular one-time fix."]},ar:{i:"افحصه سنوياً بعد ٨ سنوات تقريباً، واستبدله عند أول تشقق أو أثر تسريب",w:"خزان NC مضغوط، أي أنه جزء من دائرة التبريد وليس مجرد قارورة فائض. البلاستيك تحت الضغط مع حرارة حجرة المحرك يشيخ بسرعة: يتشقق شعرياً ثم ينفتح عند اللحام أو العنق، فتفقد السيارة سائل التبريد ببطء يصعب ملاحظته.",p:["القشرة الوردية أو البيضاء حول خط اللحام هي سائل تبريد جفّ؛ الخزان يسرّب فعلاً.","استبدل الغطاء معه؛ الغطاء المتعب لا يحفظ الضغط وتُحمَّل المشكلة على الخزان ظلماً.","تتوفر خزانات ألمنيوم بديلة (Moroso وJass Performance وبدائل مستوردة أرخص) وهي حل شائع لمرة واحدة."]}},
"NC-THERMOSTAT":{en:{i:"No interval — replace on a leak, an overheat, or a gauge that never reaches temperature",w:"Mazda sells the thermostat as an assembly with its plastic water outlet housing, and the housing is what fails: it warps and weeps at the gasket face long before the thermostat itself sticks. Replacing one means replacing both.",p:["Cars built before 09/2006 take the earlier LF94-15-17Z assembly — check the build plate, not just the model year.","A coolant smell with no drip on the floor usually means it is evaporating off the hot housing.","Refill and bleed properly afterwards; an air pocket in an NC reads as an overheat that is not one."]},ar:{i:"لا يوجد جدول؛ يُستبدل عند التسريب أو السخونة أو عند عدم وصول المؤشر لدرجة الحرارة",w:"تبيع مازدا الثرموستات كمجموعة مع بيت البلاستيك الخاص به، والبيت هو ما يتلف عادة: يتقوّس ويسرّب عند وجه الجوان قبل أن يعلق الثرموستات نفسه. استبدال أحدهما يعني استبدال الاثنين.",p:["السيارات المصنوعة قبل ٠٩/٢٠٠٦ تأخذ المجموعة الأقدم LF94-15-17Z؛ راجع لوحة تاريخ الصنع لا سنة الموديل فقط.","رائحة سائل التبريد دون قطرات على الأرض تعني غالباً أنه يتبخر على البيت الساخن.","أعد التعبئة وتنفيس الهواء بشكل صحيح؛ فقاعة هواء في NC تظهر كسخونة وهي ليست كذلك."]}},
"NC-BELT-NC1":{en:{i:"Inspect at every service; replace around 90,000 km or 5 years, whichever comes first",w:"One belt drives the alternator, water pump and A/C. Rubber here fails from heat and time more than mileage: the ribs harden, then crack, and a belt that lets go takes the charging system and the water pump with it.",p:["This is the 2006–2008 NC1 belt. The NC2/NC3 belt is longer and will not tension correctly on an NC1.","Look for glazing and rib cracks, not just squeal — a heat-hardened belt can stay quiet right up until it goes.","If you are unsure which generation you have, take the old belt to the counter."]},ar:{i:"افحصه في كل صيانة، واستبدله عند ٩٠٬٠٠٠ كم تقريباً أو كل ٥ سنوات، أيهما أسبق",w:"سير واحد يدير الدينمو وطرمبة الماء والمكيّف. المطاط هنا يتلف بالحرارة والزمن أكثر من المسافة: تتصلب الأضلاع ثم تتشقق، والسير الذي ينقطع يأخذ معه شحن البطارية وتدوير طرمبة الماء.",p:["هذا سير موديلات ٢٠٠٦–٢٠٠٨ (NC1). سير NC2/NC3 أطول ولن يُشد بشكل صحيح على NC1.","ابحث عن اللمعان وتشقق الأضلاع لا عن الصفير فقط؛ السير المتصلب بالحرارة قد يبقى صامتاً حتى لحظة انقطاعه.","إذا لم تكن متأكداً من جيل سيارتك فخذ السير القديم معك إلى المحل."]}},
"NC-BELT-NC2":{en:{i:"Inspect at every service; replace around 90,000 km or 5 years, whichever comes first",w:"Same single-belt job as the NC1, different part. Heat and time harden the ribs until they crack, and the belt takes the charging system and water pump drive with it when it goes.",p:["This is the 2009–2015 NC2/NC3 belt. The alternator pulley changed, so the NC1 part is not interchangeable.","Look for glazing and rib cracks, not just squeal.","Order by build year, not by looks — the two belts differ by about 10 mm and both will physically go on."]},ar:{i:"افحصه في كل صيانة، واستبدله عند ٩٠٬٠٠٠ كم تقريباً أو كل ٥ سنوات، أيهما أسبق",w:"نفس مهمة السير الواحد في NC1 لكن بقطعة مختلفة. الحرارة والزمن يصلّبان الأضلاع حتى تتشقق، وعند انقطاعه يتوقف شحن البطارية وتدوير طرمبة الماء.",p:["هذا سير موديلات ٢٠٠٩–٢٠١٥ (NC2/NC3). تغيّرت بكرة الدينمو، لذا لا يصلح سير NC1 بديلاً عنه.","ابحث عن اللمعان وتشقق الأضلاع لا عن الصفير فقط.","اطلبه بسنة الصنع لا بالشكل؛ الفرق بين السيرين نحو ١٠ مم وكلاهما يُركّب فعلياً."]}},
"NC-PADS-FRONT-STD":{en:{i:"Inspect every oil change; typically 40,000–60,000 km",w:"Friction material is meant to be consumed. On a car as light as the NC pads outlast most expectations, but heat is the variable — a few enthusiastic mornings on a mountain road cost more pad than months of commuting.",p:["The NC came with two front brake sizes. Measure the disc or check the caliper before ordering; sport-package pads will not fit standard calipers.","Replace across an axle, never one side.","Bed new pads in properly: a series of firm slowdowns from moderate speed, no hard stops, and do not park with them hot."]},ar:{i:"افحصها مع كل تغيير زيت؛ تدوم عادة بين ٤٠٬٠٠٠ و٦٠٬٠٠٠ كم",w:"مادة الاحتكاك مصممة لتُستهلك. في سيارة خفيفة مثل NC تدوم الفحمات أطول مما يتوقع الكثيرون، لكن الحرارة هي المتغيّر: صباحات قليلة حماسية على طريق جبلي تستهلك أكثر من أشهر من القيادة اليومية.",p:["جاءت NC بمقاسين للفرامل الأمامية. قِس الهوب أو افحص الكاليبر قبل الطلب؛ فحمات الباقة الرياضية لا تركّب على الكاليبر القياسي.","استبدلها لمحور كامل ولا تستبدل جهة واحدة أبداً.","سيّح الفحمات الجديدة بشكل صحيح: سلسلة تخفيفات سرعة حازمة من سرعة متوسطة، دون وقفات عنيفة، ولا توقف السيارة والفرامل ساخنة."]}},
"NC-PADS-FRONT-BIG":{en:{i:"Inspect every oil change; typically 40,000–60,000 km, less if driven hard",w:"Same wear story as the standard front pads, but this is the larger brake package — usually on sport-trim cars, and the pads are physically different, not just a better compound.",p:["Confirm the package before ordering. If the car has standard front brakes, these will not fit.","Replace across an axle, never one side.","Bed them in properly and expect a break-in period before the bite feels right."]},ar:{i:"افحصها مع كل تغيير زيت؛ تدوم عادة بين ٤٠٬٠٠٠ و٦٠٬٠٠٠ كم، وأقل مع القيادة الحماسية",w:"نفس قصة التآكل في الفحمات الأمامية القياسية، لكن هذه للباقة الكبيرة من الفرامل، غالباً في الفئات الرياضية، والفحمات مختلفة في المقاس لا في الخامة فقط.",p:["تأكد من نوع الباقة قبل الطلب؛ إذا كانت فرامل السيارة قياسية فلن تركّب هذه.","استبدلها لمحور كامل ولا تستبدل جهة واحدة أبداً.","سيّحها بشكل صحيح وتوقع فترة تسييح قبل أن تشعر بالعضّة الصحيحة."]}},
"NC-PADS-REAR-EARLY":{en:{i:"Inspect every oil change; usually outlast the fronts",w:"Rear pads do less work than the fronts but seize more: the rear calipers carry the parking brake mechanism, and a lazy slide pin will wear one pad to nothing while its partner still looks new.",p:["Fits cars built up to 19 May 2011. The rear brake changed mid-production — the build date on the door plate decides the part, not the model year.","Check pad thickness on both sides of the axle, not one; uneven wear is the tell that a caliper is sticking.","Clean and grease the slide pins whenever the pads come off."]},ar:{i:"افحصها مع كل تغيير زيت؛ تدوم عادة أطول من الأمامية",w:"الفحمات الخلفية تعمل أقل من الأمامية لكنها تعلق أكثر: الكاليبر الخلفي يحمل آلية فرامل اليد، ومسمار انزلاق كسول يستهلك فحمة حتى النهاية بينما تبدو شريكتها جديدة.",p:["تناسب السيارات المصنوعة حتى ١٩ مايو ٢٠١١. تغيّرت الفرامل الخلفية في منتصف الإنتاج، وتاريخ الصنع على لوحة الباب هو ما يحدد القطعة لا سنة الموديل.","افحص سماكة الفحمة على جهتي المحور لا جهة واحدة؛ التآكل غير المتساوي دليل على كاليبر عالق.","نظّف مسامير الانزلاق وشحّمها كلما فككت الفحمات."]}},
"NC-PADS-REAR-LATE":{en:{i:"Inspect every oil change; usually outlast the fronts",w:"Same rear-brake behaviour as the earlier cars — light duty, but the parking brake mechanism in the caliper means a sticking slide pin wears one side long before the other.",p:["Fits cars built from 19 May 2011 onward. Check the build date on the door plate; the model year will not tell you.","If you have ever been sold the wrong rear pads for an NC, this cut-off is why.","Clean and grease the slide pins whenever the pads come off."]},ar:{i:"افحصها مع كل تغيير زيت؛ تدوم عادة أطول من الأمامية",w:"نفس سلوك الفرامل الخلفية في السيارات الأقدم: عمل خفيف، لكن آلية فرامل اليد داخل الكاليبر تعني أن مسمار انزلاق عالق يستهلك جهة قبل الأخرى بكثير.",p:["تناسب السيارات المصنوعة من ١٩ مايو ٢٠١١ فصاعداً. راجع تاريخ الصنع على لوحة الباب؛ سنة الموديل لن تفيدك.","إذا سبق أن بيعت لك فحمات خلفية خاطئة لـ NC فهذا التاريخ هو السبب.","نظّف مسامير الانزلاق وشحّمها كلما فككت الفحمات."]}},
"NC-PCV":{en:{i:"Inspect around 80,000–100,000 km; replace if it rattles dull or not at all",w:"A one-way valve living in oil mist. Carbon and sludge build up until it sticks: stuck open gives a rough idle and an oil-hungry engine, stuck closed pressurises the crankcase and pushes oil past seals that were fine.",p:["Shake it — a free valve rattles cleanly. It is a two-minute check.","Cheap part, expensive symptom: crankcase pressure gets blamed on rear main seals far more often than it should.","Worth doing alongside spark plugs since you are already at that end of the engine."]},ar:{i:"افحصه عند ٨٠٬٠٠٠ إلى ١٠٠٬٠٠٠ كم؛ استبدله إذا كان صوت اهتزازه باهتاً أو معدوماً",w:"صمام باتجاه واحد يعيش داخل رذاذ الزيت. يتراكم الكربون والرواسب حتى يعلق: عالقاً مفتوحاً يعطي رالنتي مرتجفاً واستهلاك زيت، وعالقاً مغلقاً يرفع ضغط الكرتير فيدفع الزيت عبر جلود كانت سليمة.",p:["هزّه؛ الصمام السليم يصدر صوت اهتزاز واضحاً. فحص لا يتجاوز دقيقتين.","قطعة رخيصة بعرض مكلف: ضغط الكرتير يُحمَّل على جلدة الكرنك الخلفية أكثر مما يستحق.","يستحق تغييره مع البواجي ما دمت في هذه المنطقة من المحرك أصلاً."]}},
"NC-CLUTCH-MASTER":{en:{i:"No interval — replace on failure; flush the clutch fluid every 2–3 years to slow it down",w:"Rubber seals in an aluminium bore, heat-cycled for a decade. When they go the pedal loses its bite point gradually rather than all at once, and fluid quietly disappears from the reservoir.",p:["Symptom is a pedal that sinks to the floor, or a gearbox that will not take first at a standstill.","Look for fluid on the pedal-box carpet inside the cabin — that points to the master, not the slave.","Order by VIN at the HHA counter; the same body carried both 5-speed and 6-speed gearboxes."]},ar:{i:"لا يوجد جدول؛ تُستبدل عند التلف، وتغيير زيت الكلتش كل سنتين إلى ثلاث يؤخّر ذلك",w:"جلود مطاطية داخل أسطوانة ألمنيوم تتعرض لدورات حرارية لعشر سنوات. عند تلفها يفقد الدواسة نقطة اشتباكها تدريجياً لا فجأة، ويختفي الزيت من الخزان بهدوء.",p:["العرض: دواسة تهبط حتى الأرض، أو قير لا يدخل الغيار الأول والسيارة واقفة.","ابحث عن زيت على فرش منطقة الدواسات داخل المقصورة؛ هذا يشير إلى المضخة العلوية لا السفلية.","اطلبها برقم الهيكل من وكيل HHA؛ نفس الهيكل جاء بقير عادي ٥ سرعات و٦ سرعات."]}},
"NC-CLUTCH-SLAVE":{en:{i:"No interval — replace on failure; many owners do master and slave together",w:"The same seals in a worse position: the slave sits on the bellhousing taking engine-bay heat directly. It is the more common of the two to fail, and it leaks onto the transmission where nobody sees it.",p:["Symptom matches the master — sinking pedal, poor disengagement. Where the fluid ends up is what tells them apart.","If the gearbox is already out for a clutch job, replace it regardless of condition; the labour is free at that point.","Bleed thoroughly afterwards. Trapped air in an NC clutch line mimics a failed cylinder."]},ar:{i:"لا يوجد جدول؛ تُستبدل عند التلف، وكثيرون يغيّرون العلوية والسفلية معاً",w:"نفس الجلود في موقع أسوأ: المضخة السفلية مثبتة على بيت القير وتتلقى حرارة حجرة المحرك مباشرة. وهي الأكثر تلفاً بين الاثنتين، وتسرّب على القير حيث لا يراها أحد.",p:["العرض مطابق للمضخة العلوية: دواسة تهبط وضعف في فصل الكلتش. مكان تجمّع الزيت هو ما يفرّق بينهما.","إذا كان القير منزّلاً أصلاً لتغيير الكلتش فاستبدلها مهما كانت حالتها؛ الأجرة مدفوعة أصلاً.","نفّس الهواء جيداً بعدها؛ الهواء المحبوس في خط كلتش NC يقلّد عطل المضخة تماماً."]}},
"NC-CLUTCH-LINE":{en:{i:"No interval — replace when the pedal feels soft with no air in the system, or alongside the cylinders",w:"The flexible section perishes from the inside. As the rubber softens it balloons under pressure instead of moving fluid, so the pedal goes spongy and the clutch drags — usually blamed on the cylinders first.",p:["A braided stainless line is the common replacement here and noticeably sharpens pedal feel.","This is the part people skip when replacing both cylinders, then wonder why the pedal still is not right.","Order by VIN — line routing differs across build years."]},ar:{i:"لا يوجد جدول؛ يُستبدل عندما تصبح الدواسة إسفنجية دون وجود هواء في النظام، أو مع المضختين",w:"الجزء المرن يتلف من الداخل. مع ليونة المطاط ينتفخ تحت الضغط بدل أن يدفع الزيت، فتصبح الدواسة إسفنجية ويسحب الكلتش، وتُحمَّل المشكلة على المضختين أولاً عادة.",p:["الخرطوم الستانلس المضفور هو البديل الشائع هنا ويحسّن إحساس الدواسة بشكل ملحوظ.","هذه القطعة التي يتجاهلها الناس عند تغيير المضختين، ثم يستغربون بقاء الدواسة غير سليمة.","اطلبه برقم الهيكل؛ مسار الخرطوم يختلف بين سنوات الصنع."]}}
};
</script>

<script>
const CAT_AR={"Brakes":"الفرامل","Clutch hydraulics":"هيدروليك الكلتش","Cooling":"التبريد","Engine / Drive belt":"المحرك / سير المكينة","Engine / Emissions":"المحرك / تهوية الكرتير","Engine / Filters":"المحرك / الفلاتر","Engine / Service hardware":"المحرك / قطع الصيانة","Ignition":"الإشعال"};
const FAQ=[
 {en:"Which of these are worth buying genuine from HHA, and which are fine aftermarket?",ar:"أي من هذه القطع يستحق شراءها أصلية من الوكيل، وأيها يكفي فيها البديل؟"},
 {en:"Who actually stocks NC parts in Riyadh, Jeddah and Dammam — shop names and locations?",ar:"من يوفّر فعلياً قطع NC في الرياض وجدة والدمام؟ أسماء المحلات ومواقعها."},
 {en:"What does RockAuto shipping to Saudi cost, and how long does customs take?",ar:"كم تكلفة الشحن من RockAuto إلى السعودية، وكم تستغرق الجمارك؟"},
 {en:"What oil grade is everyone running through a Saudi summer?",ar:"ما درجة لزوجة الزيت التي يستخدمها الأعضاء في صيف السعودية؟"},
 {en:"Which workshops here know the NC well enough to touch it?",ar:"أي الورش هنا تعرف NC بما يكفي للعمل عليها؟"},
 {en:"What is the going rate locally for a clutch job on an NC?",ar:"كم السعر المعتاد محلياً لتغيير كلتش NC؟"}
];
const T={
 en:{dir:"ltr",kicker:"Mazda MX-5 · 2006–2015 · Saudi Arabia",title:"Frequently Replaced Parts",
  sub:"Frequently replaced NC MX-5 parts — OEM numbers, brand alternatives, and where to buy in Saudi and abroad.",
  ph:"Search a part, an OEM number, a brand…",all:"All parts",
  count:(n,t)=>n===t?`${t} parts`:`${n} of ${t} parts`,
  empty:"Nothing matches that. Try an OEM number or a brand name.",
  oem:"OEM",view:"View",alts:n=>`${n} alternative${n===1?"":"s"}`,
  sFit:"Fitment & numbers",sWhy:"Why it gets replaced",sX:"Brand cross-reference",sBuy:"Where to buy",sNotes:"Group notes",
  draft:"Draft — verify",lFit:"Fitment",lOem:"OEM part no.",lSup:"Supersedes",lInt:"Typical interval",
  tBrand:"Brand",tNum:"Part number",tType:"Type",tKsa:"Saudi Arabia",tIntl:"International",
  eqOem:"OEM",eqDir:"Direct",inKsa:"In Saudi Arabia",intl:"International shipping",none:"Not listed",
  noteEmpty:"No group notes yet — questions and answers from the Miata KSA Club will land here.",
  faqH:"Open questions for the group",faqLede:"Common questions from NC owners in Saudi. Answers get added as the community weighs in.",
  awaiting:"No answer yet.",
  venH:"Where these come from",venLede:"Every source referenced in the cross-reference tables above.",
  credit:"Prepared by Fayiz Melibary and Abdulwahab Sindi",
  foot1:"Source: nc_miata_catalogue.xlsx — 17 parts, 113 cross-reference entries.",
  foot2:"Failure notes and intervals are drafted, not manufacturer-issued. Confirm fitment by VIN or build date before ordering.",
  imgCap:"Reference photo of the part type — brand and finish vary by supplier. Match the part number, not the picture.",
  close:"Close"},
 ar:{dir:"rtl",kicker:"مازدا MX-5 · ٢٠٠٦–٢٠١٥ · السعودية",title:"قطع الغيار الأكثر استبدالاً",
  sub:"قطع الغيار الأكثر استبدالاً في MX-5 NC — الأرقام الأصلية، البدائل، وأماكن الشراء محلياً ودولياً.",
  ph:"ابحث باسم القطعة أو رقمها أو الماركة…",all:"كل القطع",
  count:(n,t)=>n===t?`${t} قطعة`:`${n} من ${t} قطعة`,
  empty:"لا توجد نتائج مطابقة. جرّب رقم قطعة أصلية أو اسم ماركة.",
  oem:"الرقم الأصلي",view:"التفاصيل",alts:n=>`${n} بديل`,
  sFit:"التطبيق والأرقام",sWhy:"لماذا تُستبدل كثيراً",sX:"البدائل حسب الماركة",sBuy:"أين تشتريها",sNotes:"ملاحظات المجموعة",
  draft:"مسودة — تحتاج مراجعة",lFit:"التطبيق",lOem:"رقم القطعة الأصلية",lSup:"يحل محل",lInt:"الفترة المعتادة",
  tBrand:"الماركة",tNum:"رقم القطعة",tType:"النوع",tKsa:"داخل السعودية",tIntl:"دولياً",
  eqOem:"أصلي",eqDir:"مطابق",inKsa:"داخل السعودية",intl:"شحن دولي",none:"غير مذكور",
  noteEmpty:"لا توجد ملاحظات بعد — أسئلة وإجابات أعضاء نادي ميّاتا السعودية ستظهر هنا.",
  faqH:"أسئلة مطروحة على المجموعة",faqLede:"أسئلة شائعة من ملّاك NC في السعودية. تُضاف الإجابات تباعاً بمشاركة المجتمع.",
  awaiting:"لا توجد إجابة بعد.",
  venH:"من أين تُشترى",venLede:"كل مصدر ورد في جداول البدائل أعلاه.",
  credit:"إعداد: فايز مليباري وعبدالوهاب سندي",
  foot1:"المصدر: nc_miata_catalogue.xlsx — ١٧ قطعة و١١٣ مدخلاً في جداول البدائل.",
  foot2:"ملاحظات الأعطال والفترات مسودة اجتهادية وليست صادرة عن الشركة الصانعة. تأكد من التطابق برقم الهيكل أو تاريخ الصنع قبل الطلب.",
  imgCap:"صورة مرجعية لنوع القطعة؛ الماركة والشكل يختلفان حسب المورّد. اعتمد على رقم القطعة لا على الصورة.",
  close:"إغلاق"}
};

let LANG="en",CAT="*",Q="";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const t=()=>T[LANG];
const nm=p=>LANG==="en"?p.en:p.ar;
const alt=p=>LANG==="en"?p.ar:p.en;
const catName=c=>LANG==="en"?c:(CAT_AR[c]||c);
const vName=v=>LANG==="en"?v.en:v.ar;

function matches(p){
 if(CAT!=="*"&&p.cat!==CAT)return false;
 if(!Q)return true;
 const hay=[p.en,p.ar,p.oem,p.sup,p.id,p.fit,p.cat,catName(p.cat)].concat(p.rows.map(r=>r[1]+" "+r[2])).join(" ").toLowerCase();
 return Q.split(/\s+/).every(w=>hay.includes(w));
}

function renderChrome(){
 const T_=t();
 document.querySelectorAll("[data-t]").forEach(el=>{const k=el.dataset.t;if(T_[k]!==undefined)el.textContent=T_[k];});
 $("#app").dir=T_.dir;
 $("#q").placeholder=T_.ph;
 $("#btn-en").setAttribute("aria-pressed",LANG==="en");
 $("#btn-ar").setAttribute("aria-pressed",LANG==="ar");
 const cats=[...new Set(PARTS.map(p=>p.cat))].sort();
 $("#cats").innerHTML=[["*",T_.all,PARTS.length]].concat(cats.map(c=>[c,catName(c),PARTS.filter(p=>p.cat===c).length]))
  .map(([v,l,n])=>`<button class="cat" data-cat="${esc(v)}" aria-pressed="${v===CAT}">${esc(l)}<span class="n">${n}</span></button>`).join("");
 $("#cats").querySelectorAll(".cat").forEach(b=>b.onclick=()=>{CAT=b.dataset.cat;renderChrome();renderGrid();});
 $("#faqlist").innerHTML=FAQ.map(f=>`<div class="faqq"><div class="q">${esc(LANG==="en"?f.en:f.ar)}</div><div class="a">${esc(T_.awaiting)}</div></div>`).join("");
 $("#vendors").innerHTML=VENDORS.map(v=>{
  const d=LANG==="en"?v.dEn:v.dAr, ty=LANG==="en"?v.tEn:v.tAr;
  return `<div class="vendor"><div class="vt">${esc(ty)}</div><div class="vn">${esc(vName(v))}</div>${d?`<div class="vd">${esc(d)}</div>`:""}${v.p?`<div class="vd mono">${esc(v.p)}</div>`:""}${v.u?`<div style="margin-top:6px"><a href="${esc(v.u)}" target="_blank" rel="noopener">${esc(v.u.replace(/^https?:\/\//,""))}</a></div>`:""}</div>`;
 }).join("");
}

function shortInt(n){
 if(!n)return "";
 const raw=n[LANG].i;
 let v=raw.split(LANG==="en"?/[\u2014;]/:/[\u2014\u061b\u060c]/)[0].trim();
 if(v.length>44)v=v.slice(0,42).trim()+"\u2026";
 return v;
}
function renderGrid(){
 const T_=t(),list=PARTS.filter(matches);
 $("#count").textContent=T_.count(list.length,PARTS.length);
 if(!list.length){$("#grid").innerHTML=`<div class="empty">${esc(T_.empty)}</div>`;return;}
 $("#grid").innerHTML=list.map(p=>{
  const i=PARTS.indexOf(p)+1,n=N[p.id],alts=p.rows.filter(r=>r[0]==="A").length;
  return `<button class="card" data-id="${esc(p.id)}">
   <div class="card-top">${IMG[p.id]?`<span class="thumb"><img src="${IMG[p.id].t.src}" width="${IMG[p.id].t.w}" height="${IMG[p.id].t.h}" alt="" loading="lazy"></span>`:""}<div class="ctxt"><h3>${esc(nm(p))}</h3><div class="alt-name">${esc(alt(p))}</div></div><span class="idx">${String(i).padStart(2,"0")}</span></div>
   <div style="display:flex;gap:5px;flex-wrap:wrap"><span class="chip chip-cat">${esc(catName(p.cat))}</span><span class="chip chip-int">${esc(shortInt(n))}</span></div>
   <div class="card-oem"><span class="lab">${esc(T_.oem)}</span><span class="val mono">${esc(p.oem)}</span></div>
   <div class="card-foot"><span><b>${alts}</b> ${esc(T_.alts(alts).replace(/^\d+\s*/,""))}</span><span class="viewcue">${esc(T_.view)}<span class="arrow">→</span></span></div>
  </button>`;
 }).join("");
 $("#grid").querySelectorAll(".card").forEach(b=>b.onclick=()=>openPart(b.dataset.id));
}

function srcBlock(label,str){
 const T_=t(),items=splitSrc(str);
 if(!items.length)return `<div class="src"><div class="st">${esc(label)}</div><div class="srcpills"><span class="pill">${esc(T_.none)}</span></div></div>`;
 return `<div class="src"><div class="st">${esc(label)}</div><div class="srcpills">${items.map(it=>{
  const v=it.v,lbl=v?vName(v):it.label;
  return v&&v.u?`<a class="pill" href="${esc(v.u)}" target="_blank" rel="noopener">${esc(lbl)}</a>`:`<span class="pill">${esc(lbl)}</span>`;
 }).join("")}</div></div>`;
}

let lastFocus=null;
function openPart(id){
 const T_=t(),p=PARTS.find(x=>x.id===id),i=PARTS.indexOf(p)+1,n=N[p.id][LANG];
 lastFocus=document.activeElement;
 $("#drawer").innerHTML=`
  <div class="dhead">
   <button class="dclose" id="dclose" aria-label="${esc(T_.close)}">&times;</button>
   <div class="idx2">${String(i).padStart(2,"0")} / ${PARTS.length} &nbsp;·&nbsp; ${esc(p.id)}</div>
   <h2 id="dtitle">${esc(nm(p))}</h2>
   <div class="alt2">${esc(alt(p))}</div>
   <div class="chips"><span class="chip chip-cat">${esc(catName(p.cat))}</span><span class="chip chip-int">${esc(n.i)}</span></div>
  </div>
  <div class="dbody">
   ${IMG[p.id]?`<section class="sec"><div class="dimg"><img src="${IMG[p.id].f.src}" width="${IMG[p.id].f.w}" height="${IMG[p.id].f.h}" style="aspect-ratio:${IMG[p.id].f.w}/${IMG[p.id].f.h}" alt="${esc(nm(p))}"></div><div class="imgcap">${esc(T_.imgCap)}</div></section>`:""}
   <section class="sec"><div class="sh"><span>${esc(T_.sFit)}</span></div>
    <dl class="kv">
     <dt>${esc(T_.lFit)}</dt><dd>${esc(p.fit)}</dd>
     <dt>${esc(T_.lOem)}</dt><dd class="pn mono">${esc(p.oem)}</dd>
     ${p.sup?`<dt>${esc(T_.lSup)}</dt><dd><div class="sups">${p.sup.split(",").map(s=>`<span class="sup">${esc(s.trim())}</span>`).join("")}</div></dd>`:""}
     <dt>${esc(T_.lInt)}</dt><dd>${esc(n.i)}</dd>
    </dl></section>

   <section class="sec"><details class="why-d">
    <summary class="sh why-sum"><span>${esc(T_.sWhy)}</span><span class="why-chev">▾</span></summary>
    <div class="note"><div class="why">${esc(n.w)}</div><ul class="sym">${n.p.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
   </details></section>

   <section class="sec"><div class="sh"><span>${esc(T_.sX)}</span><span class="mono" style="color:var(--ink-3)">${p.rows.length}</span></div>
    <div class="tblwrap"><table><thead><tr><th>${esc(T_.tBrand)}</th><th>${esc(T_.tNum)}</th><th>${esc(T_.tType)}</th></tr></thead><tbody>
    ${p.rows.map(r=>`<tr class="${r[0]==="O"?"oemrow":""}"><td class="brand">${esc(r[1])}</td><td class="num">${esc(r[2])}</td><td><span class="eq ${r[0]==="O"?"eq-oem":"eq-dir"}">${esc(r[0]==="O"?T_.eqOem:T_.eqDir)}</span></td></tr>`).join("")}
    </tbody></table></div></section>

   <section class="sec"><div class="sh"><span>${esc(T_.sBuy)}</span></div>
    <div class="srcgrid">
     ${srcBlock(T_.inKsa,[...new Set(p.rows.map(r=>r[4]>=0?KSA[r[4]]:"").filter(Boolean))].join(", "))}
     ${srcBlock(T_.intl,[...new Set(p.rows.map(r=>r[5]>=0?INTL[r[5]]:"").filter(Boolean))].join(", "))}
    </div></section>

   <section class="sec"><div class="sh"><span>${esc(T_.sNotes)}</span></div>
    <div class="faqq"><div class="a" style="font-style:italic">${esc(T_.noteEmpty)}</div></div></section>
  </div>`;
 $("#drawer").classList.add("on");$("#scrim").classList.add("on");
 $("#dclose").onclick=closePart;$("#drawer").focus();
}
function closePart(){$("#drawer").classList.remove("on");$("#scrim").classList.remove("on");if(lastFocus)lastFocus.focus();}

$("#scrim").onclick=closePart;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closePart();});
$("#q").addEventListener("input",e=>{Q=e.target.value.trim().toLowerCase();renderGrid();});
$("#btn-en").onclick=()=>{LANG="en";renderChrome();renderGrid();closePart();};
$("#btn-ar").onclick=()=>{LANG="ar";renderChrome();renderGrid();closePart();};
renderChrome();renderGrid();
</script>

</body>
